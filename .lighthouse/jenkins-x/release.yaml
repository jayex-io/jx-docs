apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
      - name: from-build-pack
        resources: {}
        taskSpec:
          metadata: {}
          stepTemplate:
            name: ""
            resources: {}
            workingDir: /workspace/source
            env:
              - name: GIT_COMMITTER_EMAIL
                value: jenkins-x@googlegroups.com
              - name: GIT_COMMITTER_NAME
                value: jenkins-x-bot
              - name: GIT_AUTHOR_EMAIL
                value: jenkins-x@googlegroups.com
              - name: GIT_AUTHOR_NAME
                value: jenkins-x-bot
              - name: HUGO_ENV
                value: production
              - name: HUGO_VERSION
                value: "0.101.0"
          steps:
            - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
              name: ""
              resources: {}
            - image: ghcr.io/gohugoio/hugo:v0.164.0
              name: build-website
              securityContext:
                # TODO: make /tekton/home/ writable instead
                runAsUser: 0
              env:
              - name: HUGO_GH_ACCESS_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: tekton-git
              script: |
                #!/bin/sh
                set -ex
                git config --global --add safe.directory /workspace/source
                git submodule update --init --recursive
                ./scripts/ci/update-content.sh
                hugo mod npm pack
                npm install
                git clone https://github.com/jayex-io/website.git --depth=20
                # delete everything in the website repo clone
                git -C website rm -r "*"
                # build the site into the cloned folder
                hugo -d website --enableGitInfo --baseURL https://${REPO_NAME}-jx-${REPO_OWNER}-${REPO_NAME}-pr-${PULL_NUMBER}.${DOMAIN}/
              resources:
                requests:
                  cpu: 400m
                  memory: 512Mi
            ## add, commit, and push changes
            - image: ghcr.io/jenkins-x/builder-go:2.1.155-778-patch3
              name: update-website
              command:
                - ./scripts/ci/update-website.sh
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
